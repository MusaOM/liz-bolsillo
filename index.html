<body>
<!-- Pantalla de carga minimalista (como el diseño 2): "Liz / de bolsillo" brillando, la barra y frases de laboratorio, con las bacterias detrás -->
<div id="carga" role="status" aria-live="polite">
  <div class="nombre">Liz</div>
  <div class="sub">de bolsillo</div>
  <div class="barra"><i></i></div>
  <div class="ver"></div>
  <div class="frase"></div>
</div>

<!-- Entrar (una sola vez): su correo y su contraseña (la cuenta se crea en Supabase; no se manda ningún correo) -->
<section id="entrar" hidden>
  <div class="escenaEntrar" data-liz="saludo"><div class="aura"></div></div>
  <h1>Liz de bolsillo</h1>
  <p class="suave" id="entrarTexto">Tus tarjetas, tu calendario y tus apuntes, también en el celular. Entra con tu correo y tu contraseña (solo esta vez).</p>
  <form id="formEntrar">
    <input id="correo" type="email" autocomplete="username" inputmode="email" placeholder="tu correo" required>
    <input id="clave" type="password" autocomplete="current-password" placeholder="tu contraseña" required>
    <button class="bt prin grande">Entrar</button>
  </form>
  <p class="error" id="entrarError"></p>
</section>

<main id="app" hidden>
  <header id="cabeza">
    <!-- (21-oct-2026) Una franja delgada: solo "Liz" y un puntito que aparece SOLO si hay un problema (sin internet o sin sincronizar).
         El estado completo de la sincronización está en Más → "Tu Liz y tu cuenta". -->
    <div class="marca"><span class="titulo" id="tituloVista">Liz</span><i id="puntoSync" hidden></i></div>
  </header>
  <section id="vista" class="vista"></section>
</main>
<!-- Charla con Liz: el cuadro para escribirle (solo se ve en la pestaña Liz) -->
<div id="escribirLiz" hidden><form id="formLiz"><textarea id="textoLiz" rows="1" placeholder="Escríbele a Liz…" enterkeyhint="send" maxlength="14000"></textarea><button aria-label="Enviar">➤</button></form></div>

<!-- (21-oct-2026, Liz 1.3) 5 pestañas: "Estudiar" junta Repasar y Mazos (adentro, un selector de 2 partes) -->
<nav id="menu" hidden aria-label="Menú">
  <button data-v="hoy" class="activo"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5a.5.5 0 0 0 .5.5H10v-5.5h4V20h3.5a.5.5 0 0 0 .5-.5V10"/></svg>Hoy</button>
  <button data-v="estudiar"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="14" rx="2.5" transform="rotate(-8 9.5 13.5)"/><path d="M10 4.2l7.6.9a2.5 2.5 0 0 1 2.2 2.8l-1.2 10"/></svg>Estudiar</button>
  <button data-v="charla"><span class="lizFoto caraMenu" id="caraMenu"></span>Liz</button>
  <button data-v="agenda"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".6"/><circle cx="12" cy="14.5" r=".6"/><circle cx="15.5" cy="14.5" r=".6"/></svg>Agenda</button>
  <button data-v="mas"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>Más</button>
</nav>

<div id="velo" hidden></div>
<div id="hoja" hidden role="dialog" aria-modal="true"></div>
<div id="cine" hidden role="dialog" aria-modal="true" aria-label="El tráiler de Liz"></div>
<div id="aviso" role="status" aria-live="polite"></div>
<label id="haptico" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<input type="file" id="elegirArchivo" accept=".pdf,.docx,.pptx,.txt,.md,image/*,application/pdf" hidden>
<!-- (19-oct-2026) Importar tarjetas ya hechas: un .json del celular (en el iPhone, desde la app Archivos). Se lee aquí mismo: no se sube a ningún lado -->
<input type="file" id="elegirJson" accept="application/json,.json,text/json,text/plain" hidden>
