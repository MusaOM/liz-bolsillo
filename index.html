<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1622">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liz">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/estilo.css">
<title>Liz</title>
</head>
<body>
<!-- Pantalla de carga (como la de la PC: frases de laboratorio) -->
<div id="carga" role="status" aria-live="polite">
  <div class="nombre">Liz</div>
  <div class="sub">de bolsillo</div>
  <div class="barra"><i></i></div>
  <div class="frase"></div>
</div>

<!-- Entrar (una sola vez): su correo → un código que le llega al correo -->
<section id="entrar" hidden>
  <div class="logo" aria-hidden="true"></div>
  <h1>Liz de bolsillo</h1>
  <p class="suave" id="entrarTexto">Tus tarjetas, tu calendario y tus apuntes, también en el celular. Escribe el mismo correo que usas en la Liz de tu compu.</p>
  <form id="formCorreo">
    <input id="correo" type="email" autocomplete="email" inputmode="email" placeholder="tu correo" required>
    <button class="bt prin grande">Enviarme un código</button>
  </form>
  <form id="formCodigo" hidden>
    <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" placeholder="código" required>
    <button class="bt prin grande">Entrar</button>
    <button type="button" class="enlace" id="otroCorreo">Usar otro correo</button>
  </form>
  <p class="error" id="entrarError"></p>
</section>

<main id="app" hidden>
  <header id="cabeza">
    <button class="liz-foto" id="lizMini" aria-label="Ir a Hoy"></button>
    <div class="titulo"><strong id="tituloVista">Hoy</strong><span id="estadoSync"></span></div>
  </header>
  <section id="vista" class="vista"></section>
</main>

<nav id="menu" hidden aria-label="Menú">
  <button data-v="hoy" class="activo"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5a.5.5 0 0 0 .5.5H10v-5.5h4V20h3.5a.5.5 0 0 0 .5-.5V10"/></svg>Hoy</button>
  <button data-v="repasar"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="14" rx="2.5" transform="rotate(-8 9.5 13.5)"/><path d="M10 4.2l7.6.9a2.5 2.5 0 0 1 2.2 2.8l-1.2 10"/></svg>Repasar</button>
  <button data-v="agenda"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".6"/><circle cx="12" cy="14.5" r=".6"/><circle cx="15.5" cy="14.5" r=".6"/></svg>Agenda</button>
  <button data-v="mazos"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.5L12 12.5 3.5 8z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16 8.5 4.5 8.5-4.5"/></svg>Mazos</button>
  <button data-v="mas"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>Más</button>
</nav>

<div id="velo" hidden></div>
<div id="hoja" hidden role="dialog" aria-modal="true"></div>
<div id="aviso" role="status" aria-live="polite"></div>
<input type="file" id="elegirArchivo" accept=".pdf,.docx,.pptx,.txt,.md,image/*,application/pdf" hidden>

<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/sincro.js"></script>
<script src="js/organizar.js"></script>
<script src="js/agenda.js"></script>
<script src="js/frases.js"></script>
<script src="js/almacen.js"></script>
<script src="js/fondo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
